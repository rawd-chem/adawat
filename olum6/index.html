<style>
:root{--ink:#2b2350;--mut:#7a7399;--lav:#8b7be8;--lav2:#b8adf5;--pink:#f08bb4;--teal:#2bb7a8;--mint:#dff6f1;--sky:#e9e5ff;--cream:#fff8fb;--amber:#ffbf47;--line:#ebe6fb;--ok:#22a98f;--bad:#e2577a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:#f7f4ff;background-image:radial-gradient(circle at 10% 0%,rgba(240,139,180,.16),transparent 35%),radial-gradient(circle at 95% 25%,rgba(43,183,168,.14),transparent 35%);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 18px;background:linear-gradient(120deg,#6f5fd8,#9a7fe6 55%,#e98bb7);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 10px 26px rgba(111,95,216,.25)}
.lg{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;flex:none}

.hb{margin-inline-start:auto;display:flex;gap:6px}
.hb button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:8px 10px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px 12px 90px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 22px rgba(80,60,160,.08);border:1px solid var(--line);margin-bottom:12px}
.btn{border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;background:linear-gradient(135deg,#8b7be8,#6f5fd8);color:#fff;box-shadow:0 6px 14px rgba(111,95,216,.25)}
.btn.pk{background:linear-gradient(135deg,#f5a3c5,#e7709f)}.btn.tl{background:linear-gradient(135deg,#3cc7b8,#21a092)}.btn.gh{background:#f2efff;color:var(--ink);box-shadow:none}.btn.w{width:100%}
.btn:disabled{opacity:.5}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);border-radius:22px;padding:18px 12px;text-align:center;background:#fff;cursor:pointer;font-weight:800;font-size:18px}
.choice div{font-size:44px;margin-bottom:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink)}
.names button.on{border-color:var(--lav);background:var(--sky)}
.pin{display:flex;gap:8px;justify-content:center;margin:12px 0;direction:ltr}
.pin input{width:58px;height:62px;text-align:center;font-size:28px;font-weight:800;border:2px solid var(--lav2);border-radius:16px;font-family:inherit}
.msg{color:var(--mut);font-weight:700;line-height:1.7}
.me{display:flex;align-items:center;gap:12px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--sky);flex:none}
.pts{margin-inline-start:auto;text-align:center;background:linear-gradient(135deg,#fff2c9,#ffe08a);border-radius:18px;padding:8px 14px}
.pts b{display:block;font-size:26px}.pts span{font-size:12px;font-weight:800;color:#8a6200}
.unit{font-weight:800;color:var(--lav);margin:14px 4px 6px;font-size:15px}
.les{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:18px;padding:12px;background:#fff;margin-bottom:8px;cursor:pointer}
.les.lock{opacity:.5;cursor:default;background:#faf9ff}
.les .n{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--mint);color:#137e72;flex:none;direction:ltr}
.les .t{font-weight:800;font-size:16px;line-height:1.5}.les .st{font-size:13px;color:var(--amber);letter-spacing:1px}
.les .go{margin-inline-start:auto;font-size:22px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gm{border:2px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center;background:#fff;cursor:pointer}
.gm div{font-size:34px}.gm b{display:block;font-size:16px;margin-top:4px}.gm small{color:var(--mut);font-weight:700}
.way{background:linear-gradient(135deg,#f3efff,#eafaf6)}.steps{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.steps span{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;display:flex;align-items:center;gap:6px}.steps i{font-style:normal;background:var(--lav);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}.steps em{font-style:normal;color:var(--lav);font-weight:800}
.stp{display:flex;align-items:center;gap:10px}.stp .sn{flex:0 0 38px;height:38px;border-radius:50%;background:var(--lav);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}.stp.done .sn{background:var(--ok)}.stp.off{opacity:.6}
.games.locked .gm{opacity:.45;filter:grayscale(.6)}

.gm .best{display:inline-block;margin-top:6px;background:#fff4d6;color:#8a6200;border-radius:999px;padding:2px 10px;font-weight:800;font-size:12px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink);line-height:1.5;margin-bottom:8px;width:100%;min-height:56px}

.cats{display:grid;gap:9px}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin:8px 0 12px;padding:8px;border-radius:14px;background:#f6f3ff}
.seq span{background:var(--lav);color:#fff;border-radius:12px;padding:7px 12px;font-weight:800}
.clock{font-size:34px;font-weight:800;text-align:center;color:var(--lav)}
.res{text-align:center}.res .e{font-size:64px;display:inline-block;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}

.res.win{background:linear-gradient(180deg,#fff8e6,#fff)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:99}
.mtn{position:relative;border-radius:22px;overflow:hidden;margin:-4px -4px 6px;background:linear-gradient(180deg,#bfe8ff 0,#e9e5ff 55%,#fff8fb 100%)}
.mtn svg{display:block;width:100%;height:auto}
.mtn .who{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:none}
.mtn .who .b{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 10px #2b235040;border:3px solid #fff}
.mtn .who.me .b{border-color:#ff6fa6;box-shadow:0 0 0 4px #ff6fa655,0 3px 10px #2b235040;animation:glow 1.4s infinite}

.mtn .who .n{margin-top:2px;background:#ffffffe6;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:800;white-space:nowrap;color:var(--ink)}
.mtn .who.top .b{background:#ffe27a}
.mtn .who .cr{position:absolute;top:-17px;font-size:18px}
.motiv{margin:8px 0 2px;background:linear-gradient(135deg,#fff0f7,#f1ecff);border-radius:16px;padding:10px 12px;font-weight:800;text-align:center;font-size:15px}
.res .sc{font-size:46px;font-weight:800;color:var(--lav)}
.rank{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px dashed var(--line);font-weight:800}
.rank .p{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f2efff}
.rank.r1 .p{background:#ffd76a}.rank.r2 .p{background:#e3e3ee}.rank.r3 .p{background:#f6c59a}.rank.meR{background:#fff6fb;border-radius:12px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:99;display:none;max-width:90vw;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}th{background:#f2efff}td.nm{text-align:right;font-weight:800;white-space:nowrap}
.hm{border-radius:6px;padding:3px 0;font-weight:800}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chk label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px;font-weight:700;font-size:14px}
</style>

function cardGame(l,title,items,btns,gk,hint){let i=0,c=0; const I=shuffle(items);
  const show=()=>{if(i>=I.length) return finish(l,gk,Math.round(100*c/I.length),`أصبتِ في ${AR(c)} من ${AR(I.length)}`);
    frame(l,title,`${hint?`<p class="msg" style="margin-top:0">${hint}</p>`:''}<div class="item">${esc(I[i][0])}</div><div class="cats">${btns.map((b,k)=>`<button class="op" data-k="${k}">${esc(b)}</button>`).join('')}</div><div class="fb" id="fb"></div>`); setBar(i,I.length);
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(app.querySelector('.op.ok'))return; const ok=+b.dataset.k===I[i][1]; snd(ok); if(ok)c++; app.querySelectorAll('[data-k]').forEach(x=>{if(+x.dataset.k===I[i][1])x.classList.add('ok');else if(x===b)x.classList.add('bad');}); $('fb').className='fb '+(ok?'g':'r'); $('fb').textContent=ok?'✓ صحيح':'✗ مكانها الصحيح: '+btns[I[i][1]]; setTimeout(()=>{i++;show();},ok?700:1500);});};
  show();}
const sort=l=>cardGame(l,'صنّفي',l.sort.items,l.sort.cats,'sort',l.sort.hint||'أين تضعين هذه؟');
const diff=l=>cardGame(l,'ما الفرق؟',l.diff.items,[l.diff.a,l.diff.b],'diff',l.diff.hint||'هذه الصفة لأيّهما؟');
function order(l){const it=l.order.items; let k=0,miss=0; const S=shuffle(it.map((x,i)=>[x,i]));
  frame(l,'رتّبي',`<p class="msg" style="margin-top:0">${esc(l.order.title)}: اضغطي بالترتيب الصحيح.</p><div class="seq" id="sq"></div><div>${S.map(s=>`<button class="tile" data-o="${s[1]}">${esc(s[0])}</button>`).join('')}</div>`); setBar(0,it.length);
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return; if(+b.dataset.o===k){snd(1); b.classList.add('done'); $('sq').insertAdjacentHTML('beforeend',`<span>${AR(k+1)}. ${esc(it[k])}</span>`); k++; setBar(k,it.length); if(k===it.length) setTimeout(()=>finish(l,'order',Math.max(20,100-miss*15),miss?`أخطأتِ ${AR(miss)} مرة`:'ترتيب كامل بلا خطأ!'),500);}
    else{snd(0); miss++; b.classList.add('err'); setTimeout(()=>b.classList.remove('err'),500);}});}
function speed(){const pool=shuffle(LES.filter(l=>isOpen(l.id)).flatMap(l=>l.quiz.map(q=>Object.assign({lt:l.title},q)))); if(!pool.length){toast('لا توجد دروس مفتوحة بعد');return;}
  let i=0,c=0,left=60,tm=null; const end=()=>{clearInterval(tm); finish(null,'speed',c*5,`أجبتِ إجابة صحيحة عن ${AR(c)} سؤالًا في دقيقة`);};
  const show=()=>{const q=pool[i%pool.length]; const o=q.tf?q.o:shuffle(q.o);
    frame(null,'⏱️ تحدّي الدقيقة',`<div class="clock" id="ck">${AR(left)}</div><div class="msg" style="text-align:center;font-size:13px">${esc(q.lt)} · صحيحة: ${AR(c)}</div><div class="q">${esc(q.q)}</div><div class="ops${q.tf||o.every(x=>x.length<14)?' two':''}">${o.map(x=>`<button class="op" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`); $('pb').style.width=(100*(60-left)/60)+'%';
    $('bk').onclick=()=>{clearInterval(tm);home();};
    app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(app.querySelector('.op.ok,.op.bad'))return; const ok=b.dataset.v===q.a; snd(ok); if(ok)c++; b.classList.add(ok?'ok':'bad'); if(!ok) app.querySelectorAll('.op').forEach(x=>{if(x.dataset.v===q.a)x.classList.add('ok')}); setTimeout(()=>{i++; if(left>0) show();},ok?300:900);});};
  show(); tm=setInterval(()=>{left--; const e=$('ck'); if(e) e.textContent=AR(Math.max(0,left)); if(left<=0) end();},1000);}

/* ---------- leaderboard ---------- */
const MP=[[52,452],[300,412],[78,352],[286,300],[96,248],[262,196],[132,150],[230,112],[180,62]];
function mPt(t){const seg=[];let L=0;for(let i=1;i<MP.length;i++){const d=Math.hypot(MP[i][0]-MP[i-1][0],MP[i][1]-MP[i-1][1]);seg.push(d);L+=d;}
  let r=t*L;for(let i=0;i<seg.length;i++){if(r<=seg[i]){const k=r/seg[i];return [MP[i][0]+(MP[i+1][0]-MP[i][0])*k,MP[i][1]+(MP[i+1][1]-MP[i][1])*k];}r-=seg[i];}return MP[MP.length-1];}
function mountain(){const path=MP.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  return `<svg viewBox="0 0 360 480" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9d8cf0"/><stop offset="1" stop-color="#6fcfb6"/></linearGradient><linearGradient id="mg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7bdf7"/><stop offset="1" stop-color="#a8e6d4"/></linearGradient></defs>
  <circle cx="300" cy="64" r="26" fill="#ffd76a" opacity=".9"/><g fill="#fff" opacity=".85"><ellipse cx="62" cy="80" rx="34" ry="12"/><ellipse cx="86" cy="72" rx="22" ry="12"/><ellipse cx="292" cy="150" rx="30" ry="10"/></g>
  <path d="M-10 480 L70 300 L110 340 L180 40 L250 330 L290 290 L370 480Z" fill="url(#mg2)" opacity=".7"/>
  <path d="M-10 480 L180 40 L370 480Z" fill="url(#mg)"/><path d="M180 40 L150 110 L166 102 L180 120 L196 100 L210 110Z" fill="#fff"/>
  <path d="${path}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 12" opacity=".9"/>
  <line x1="180" y1="40" x2="180" y2="8" stroke="#2b2350" stroke-width="3"/><path d="M180 8 L208 16 L180 25Z" fill="#ff6fa6"/>
  <text x="180" y="474" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">البداية</text></svg>`;}
async function board(){hdr('<button id="bk">🏠 الرئيسية</button>'); $('bk').onclick=home;
  app.innerHTML=`<div class="card"><b style="font-size:19px">🏔️ تحدّي القمة</b><div class="msg" style="font-size:13px">كل نقطة ترفعكِ خطوة نحو القمة 🚩</div><div class="mtn" id="mt" style="margin-top:8px">${mountain()}</div><div id="mv"></div><div id="pl" class="msg" style="margin-top:6px">جارٍ التحميل…</div></div><div class="card"><b style="font-size:17px">👭 المجموعات</b><div id="gl" class="msg" style="margin-top:8px"></div></div>`;
  try{const q=await db.collection('olum6_players').get(); const L=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(p=>p.id[0]==='s'&&(p.total||0)>0).sort((a,b)=>(b.total||0)-(a.total||0));
    $('pl').innerHTML=L.length?L.map((p,i)=>`<div class="rank r${i+1}${WHO&&WHO.id===p.id?' meR':''}"><div class="p">${i<3?['🥇','🥈','🥉'][i]:AR(i+1)}</div><span>${AVS[+p.id.slice(1)]||''} ${esc((p.name||'').split(' ')[0])}</span><b>${AR(p.total||0)}</b></div>`).join(''):'لم تبدأ أي طالبة بعد، كوني الأولى!';
    const top=L.length?(L[0].total||1):1, mt=$('mt'), used={};
    const els=L.map((p,i)=>{const t=Math.min(.97,.05+.92*(p.total||0)/top); const k=Math.round(t*16); used[k]=(used[k]||0)+1; const u=used[k]-1, off=u?Math.ceil(u/2)*(u%2?1:-1)*44:0;
      const d=document.createElement('div'); d.className='who'+(WHO&&WHO.id===p.id?' me':'')+(i===0?' top':''); d.innerHTML=`${i===0?'<span class="cr">👑</span>':''}<div class="b">${AVS[+p.id.slice(1)]||'🙂'}</div><div class="n">${WHO&&WHO.id===p.id?'أنتِ':esc((p.name||'').split(' ')[0])}</div>`; mt.appendChild(d); return {d,t,off,delay:300+i*160};});
    const t0=performance.now(), place=(o,t)=>{const [x,y]=mPt(t); o.d.style.left=((x+o.off)/360*100)+'%'; o.d.style.top=(y/480*100)+'%';};
    els.forEach(o=>place(o,0));
    (function f(now){let busy=false; els.forEach(o=>{const e=Math.max(0,Math.min(1,(now-t0-o.delay)/1800)); if(e<1)busy=true; const k=1-Math.pow(1-e,3); place(o,o.t*k);}); if(busy) requestAnimationFrame(f); else {if(L.length){confetti(90,2000);}}})(t0);
    if(WHO&&WHO.t==='s'&&!isT()){const i=L.findIndex(p=>p.id===WHO.id); let m='';
      if(i===0) m='👑 أنتِ على القمة! حافظي على مكانكِ';
      else if(i>0){const gap=(L[i-1].total||0)-(L[i].total||0)+1; m=`⛰️ باقي لكِ ${AR(gap)} نقطة لتصعدي إلى المركز ${AR(i)}`;}
      else m='🚶‍♀️ العبي أول تحدٍّ لتبدئي الصعود نحو القمة';
      $('mv').innerHTML=`<div class="motiv">${m}</div>`;}
    const g=await db.collection('olum6_groups').get(); const G=g.docs.map(d=>d.data()).sort((a,b)=>(b.total||0)-(a.total||0));
    $('gl').innerHTML=G.length?G.map((x,i)=>`<div class="rank r${i+1}"><div class="p">${i<3?['🥇','🥈','🥉'][i]:AR(i+1)}</div><span>${esc(x.name)}</span><b>${AR(x.total||0)}</b></div>`).join(''):'لا توجد نقاط للمجموعات بعد.';}
  catch(e){$('pl').textContent='تعذّر التحميل، تأكدي من الإنترنت.';}}

    const cell=(p,l)=>{const gs=GAMES.filter(g=>l[g.k]); const v=gs.map(g=>(p.best||{})[l.id+'_'+g.k]||0); const played=v.filter(Boolean).length; if(!played) return '<td>–</td>'; const avg=Math.round(v.reduce((a,b)=>a+b,0)/gs.length); const c=avg>=80?'#d8f5ec':avg>=50?'#fff2cc':'#fde0e7'; return `<td><div class="hm" style="background:${c}">${AR(avg)}٪</div></td>`;};
