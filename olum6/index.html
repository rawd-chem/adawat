<head>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--mut:#7a7399;--lav:#8b7be8;--lav2:#b8adf5;--pink:#f08bb4;--teal:#2bb7a8;--mint:#dff6f1;--sky:#e9e5ff;--cream:#fff8fb;--amber:#ffbf47;--line:#ebe6fb;--ok:#22a98f;--bad:#e2577a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:#f7f4ff;background-image:radial-gradient(circle at 10% 0%,rgba(240,139,180,.16),transparent 35%),radial-gradient(circle at 95% 25%,rgba(43,183,168,.14),transparent 35%);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 18px;background:linear-gradient(120deg,#6f5fd8,#9a7fe6 55%,#e98bb7);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 10px 26px rgba(111,95,216,.25)}
.lg{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;flex:none}
header h1{margin:0;font-size:22px;font-weight:800}header .s{font-size:13px;font-weight:700;opacity:.92}
.hb{margin-inline-start:auto;display:flex;gap:6px}
.hb button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:8px 10px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px 12px 90px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 22px rgba(80,60,160,.08);border:1px solid var(--line);margin-bottom:12px}
.btn{border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;background:linear-gradient(135deg,#8b7be8,#6f5fd8);color:#fff;box-shadow:0 6px 14px rgba(111,95,216,.25)}
.btn.pk{background:linear-gradient(135deg,#f5a3c5,#e7709f)}.btn.tl{background:linear-gradient(135deg,#3cc7b8,#21a092)}.btn.gh{background:#f2efff;color:var(--ink);box-shadow:none}.btn.w{width:100%}
.btn:disabled{opacity:.5}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);border-radius:22px;padding:18px 12px;text-align:center;background:#fff;cursor:pointer;font-weight:800;font-size:18px}
.choice div{font-size:44px;margin-bottom:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink)}
.names button.on{border-color:var(--lav);background:var(--sky)}
.pin{display:flex;gap:8px;justify-content:center;margin:12px 0;direction:ltr}
.pin input{width:58px;height:62px;text-align:center;font-size:28px;font-weight:800;border:2px solid var(--lav2);border-radius:16px;font-family:inherit}
.msg{color:var(--mut);font-weight:700;line-height:1.7}
.me{display:flex;align-items:center;gap:12px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--sky);flex:none}
.pts{margin-inline-start:auto;text-align:center;background:linear-gradient(135deg,#fff2c9,#ffe08a);border-radius:18px;padding:8px 14px}
.pts b{display:block;font-size:26px}.pts span{font-size:12px;font-weight:800;color:#8a6200}
.unit{font-weight:800;color:var(--lav);margin:14px 4px 6px;font-size:15px}
.les{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:18px;padding:12px;background:#fff;margin-bottom:8px;cursor:pointer}
.les.lock{opacity:.5;cursor:default;background:#faf9ff}

.les .t{font-weight:800;font-size:16px;line-height:1.5}.les .st{font-size:13px;color:var(--amber);letter-spacing:1px}
.les .go{margin-inline-start:auto;font-size:22px}

.ops{display:grid;gap:9px}.ops.two{grid-template-columns:1fr 1fr}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink);line-height:1.5;margin-bottom:8px;width:100%;min-height:56px}
.tile.sel{border-color:var(--lav);background:var(--sky)}.tile.done{border-color:var(--ok);background:#e3f7f1;color:#11735f;cursor:default;opacity:.75}.tile.err{border-color:var(--bad);background:#fde9ee}
.item{font-size:22px;font-weight:800;text-align:center;background:var(--cream);border:2px dashed var(--pink);border-radius:20px;padding:22px 12px;margin:6px 0 14px;line-height:1.6}
.cats{display:grid;gap:9px}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin:8px 0 12px;padding:8px;border-radius:14px;background:#f6f3ff}
.seq span{background:var(--lav);color:#fff;border-radius:12px;padding:7px 12px;font-weight:800}
.clock{font-size:34px;font-weight:800;text-align:center;color:var(--lav)}
.res{text-align:center}.res .e{font-size:56px}.res .sc{font-size:46px;font-weight:800;color:var(--lav)}
.rank{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px dashed var(--line);font-weight:800}

</style>

function quiz(l){const Q=shuffle(l.quiz).slice(0,10); let i=0,c=0;
  const show=()=>{if(i>=Q.length) return finish(l,'quiz',Math.round(100*c/Q.length),`أصبتِ في ${AR(c)} من ${AR(Q.length)}`); const q=Q[i]; const o=q.tf?q.o:shuffle(q.o);

    app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(app.querySelector('.op.ok,.op.bad')) return; const ok=b.dataset.v===q.a; snd(ok); if(ok)c++; app.querySelectorAll('.op').forEach(x=>{if(x.dataset.v===q.a)x.classList.add('ok');else if(x===b)x.classList.add('bad');});

    $('nx').onclick=()=>{i++;show();};};
  show();}
function pairs(l){const P=shuffle(l.pairs); let sel=null,done=0,miss=0; const D=shuffle(P.map((p,i)=>[p[1],i]));
  frame(l,'طابقي المصطلح بتعريفه',`<p class="msg" style="margin-top:0">اضغطي مصطلحًا ثم تعريفه.</p><div class="cols"><div>${P.map((p,i)=>`<button class="tile" data-t="${i}">${esc(p[0])}</button>`).join('')}</div><div>${D.map(d=>`<button class="tile" data-d="${d[1]}">${esc(d[0])}</button>`).join('')}</div></div><div class="fb" id="fb"></div>`); setBar(0,P.length);

function cardGame(l,title,items,btns,gk,hint){let i=0,c=0; const I=shuffle(items);

  <div class="card"><b>الدروس المفتوحة للطالبات</b><div class="chk" id="ck" style="margin-top:8px"></div><button class="btn tl w" id="sv" style="margin-top:10px">احفظي</button></div>
  <div class="card"><b>إدارة</b><p class="msg" style="font-size:13px;margin:4px 0 8px">إذا نسيت طالبة رقمها السري، امسحيه فتختار رقمًا جديدًا عند الدخول (نقاطها تبقى).</p><div class="names" id="rs"></div><button class="btn gh w" id="rg" style="margin-top:10px">تصفير نقاط المجموعات</button>
  <p class="msg" style="font-size:13px;margin:14px 0 8px">🗑️ مسح كل بيانات طالبة (نقاطها ونتائجها ورقمها السري)، فتبدأ من جديد:</p><div class="names" id="del"></div></div>
  <div class="card" style="background:linear-gradient(135deg,#f3efff,#eafaf6)"><b>👩‍🏫 حسابي التجريبي</b><p class="msg" style="font-size:13px;margin:4px 0 8px">حساب طالبة خفي لكِ وحدكِ: لا يظهر في قائمة الأسماء ولا في لوحة الشرف ولا في جدول التقدّم، وليس عليه حدّ الدرسين.</p><button class="btn w" id="tgo">ادخلي كطالبة</button><button class="btn gh w" id="tdel" style="margin-top:8px">امسحي بيانات حسابي التجريبي</button></div>`;
  await loadCfg();
  $('ck').innerHTML=LES.map(l=>`<label><input type="checkbox" value="${l.id}"${isOpen(l.id)?' checked':''}>${esc(l.title)}</label>`).join('');
  $('sv').onclick=async()=>{const o=[...$('ck').querySelectorAll('input:checked')].map(x=>x.value); try{await db.collection('olum6_cfg').doc('main').set({open:o},{merge:true}); OPEN=o; toast('تم الحفظ');}catch(e){toast('تعذّر الحفظ');}};
  $('rs').innerHTML=ROSTER.map((n,i)=>`<button data-r="${i}">🔑 ${esc(n.split(' ')[0])}</button>`).join('');
  $('rs').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='اضغطي للتأكيد';return;} try{await db.collection('olum6_players').doc('s'+b.dataset.r).set({pin:''},{merge:true}); b.textContent='✓ مُسح الرقم';}catch(e){toast('تعذّر');}});
  $('del').innerHTML=ROSTER.map((n,i)=>`<button data-x="${i}">🗑️ ${esc(n.split(' ')[0])}</button>`).join('');
  $('del').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='اضغطي للتأكيد: مسح '+ROSTER[+b.dataset.x].split(' ')[0];return;} try{await db.collection('olum6_players').doc('s'+b.dataset.x).delete(); b.textContent='✓ مُسحت بيانات '+ROSTER[+b.dataset.x].split(' ')[0]; b.disabled=true;}catch(e){toast('تعذّر المسح');}});
  $('tgo').onclick=()=>{WHO={t:'s',id:'t0',name:'المعلمة'}; LS.set('who',WHO); history.replaceState(null,'',location.pathname); home();};
  $('tdel').onclick=async()=>{const b=$('tdel'); if(!b.dataset.sure){b.dataset.sure=1;b.textContent='اضغطي مرة أخرى للتأكيد';return;} try{await db.collection('olum6_players').doc('t0').delete(); b.textContent='✓ مُسحت بيانات حسابكِ التجريبي';}catch(e){toast('تعذّر');}};
  $('rg').onclick=async()=>{const b=$('rg'); if(!b.dataset.sure){b.dataset.sure=1;b.textContent='اضغطي مرة أخرى للتأكيد';return;} try{for(let i=0;i<GROUPS.length;i++) await db.collection('olum6_groups').doc('g'+i).set({name:GROUPS[i],total:0}); b.textContent='✓ تم التصفير';}catch(e){toast('تعذّر');}};
  try{const q=await db.collection('olum6_players').get(); const M={}; q.docs.forEach(d=>M[d.id]=d.data());
    const cell=(p,l)=>{const gs=GAMES.filter(g=>l[g.k]); const v=gs.map(g=>(p.best||{})[l.id+'_'+g.k]||0); const played=v.filter(Boolean).length; if(!played) return '<td>–</td>'; const avg=Math.round(v.reduce((a,b)=>a+b,0)/gs.length); const c=avg>=80?'#d8f5ec':avg>=50?'#fff2cc':'#fde0e7'; return `<td><div class="hm" style="background:${c}">${AR(avg)}٪</div></td>`;};
    $('tb').innerHTML=`<table><tr><th>الطالبة</th><th>النقاط</th><th>أيام</th>${LES.map(l=>`<th title="${esc(l.title)}">${AR(l.unit)}/${AR(l.id.split("-")[1])}</th>`).join('')}</tr>${ROSTER.map((n,i)=>{const p=M['s'+i]||{};return `<tr><td class="nm">${esc(n.split(' ')[0])}</td><td>${AR(p.total||0)}</td><td>${AR((p.days||[]).length)}</td>${LES.map(l=>cell(p,l)).join('')}</tr>`;}).join('')}</table>`;}
  catch(e){$('tb').textContent='تعذّر التحميل.';}}

/* ---------- boot ---------- */
(async()=>{
  if(!db){app.innerHTML='<div class="card msg">تعذّر التحميل، تأكدي من الإنترنت ثم حدّثي الصفحة.</div>';return;}
  await loadCfg(); track('open');
  if(P.get('admin')){ if(await sha(P.get('admin'))===ADMIN_HASH) return admin(); app.innerHTML='<div class="card msg">الرابط غير صحيح.</div>'; return; }
  if(WHO) home(); else welcome();
})();
</script>
<script>/* adawat usage counter (anonymous counts only) */
(function(){
  var P="chem-labs-3c9de",K="AIzaSyA8feIuu619z53rYQ4soTE15E0wD2x4k1k";
  var D="projects/"+P+"/databases/(default)/documents";
  var URL_="https://firestore.googleapis.com/v1/"+D+":commit?key="+K;
  function day(){return new Date(Date.now()+3*3600e3).toISOString().slice(0,10)}
  function inc(f){return {fieldPath:f,increment:{integerValue:"1"}}}
  window.adawatTrack=function(tool,ev){
    try{
      if(navigator.onLine===false)return;
      var f=[inc(ev)];
      if(ev==="open"){try{var k="adawat_dev_"+tool;if(!localStorage.getItem(k)){localStorage.setItem(k,"1");f.push(inc("devices"))}}catch(e){}}
      var w=[{transform:{document:D+"/adawat_stats/"+tool,fieldTransforms:f}},{transform:{document:D+"/adawat_daily/"+day(),fieldTransforms:[inc(tool+"_"+ev)]}}];
      fetch(URL_,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({writes:w}),keepalive:true}).catch(function(){});
    }catch(e){}
  };
  window.adawatAutoTrack=function(tool,map){
    try{adawatTrack(tool,"open")}catch(e){}
    document.addEventListener("click",function(e){var b=e.target&&e.target.closest&&e.target.closest("button[id]");if(b&&map[b.id])adawatTrack(tool,map[b.id])},true);
  };
})();
</script>
