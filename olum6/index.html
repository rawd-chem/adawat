<style>
:root{--ink:#2b2350;--mut:#7a7399;--lav:#8b7be8;--lav2:#b8adf5;--pink:#f08bb4;--teal:#2bb7a8;--mint:#dff6f1;--sky:#e9e5ff;--cream:#fff8fb;--amber:#ffbf47;--line:#ebe6fb;--ok:#22a98f;--bad:#e2577a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:#f7f4ff;background-image:radial-gradient(circle at 10% 0%,rgba(240,139,180,.16),transparent 35%),radial-gradient(circle at 95% 25%,rgba(43,183,168,.14),transparent 35%);min-height:100vh}

.lg{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;flex:none}

.hb{margin-inline-start:auto;display:flex;gap:6px}
.hb button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:8px 10px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px 12px 90px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 22px rgba(80,60,160,.08);border:1px solid var(--line);margin-bottom:12px}
.btn{border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;background:linear-gradient(135deg,#8b7be8,#6f5fd8);color:#fff;box-shadow:0 6px 14px rgba(111,95,216,.25)}
.btn.pk{background:linear-gradient(135deg,#f5a3c5,#e7709f)}.btn.tl{background:linear-gradient(135deg,#3cc7b8,#21a092)}.btn.gh{background:#f2efff;color:var(--ink);box-shadow:none}.btn.w{width:100%}

.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);border-radius:22px;padding:18px 12px;text-align:center;background:#fff;cursor:pointer;font-weight:800;font-size:18px}
.choice div{font-size:44px;margin-bottom:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink)}

.cats{display:grid;gap:9px}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin:8px 0 12px;padding:8px;border-radius:14px;background:#f6f3ff}
.seq span{background:var(--lav);color:#fff;border-radius:12px;padding:7px 12px;font-weight:800}

.rank.r1 .p{background:#ffd76a}.rank.r2 .p{background:#e3e3ee}.rank.r3 .p{background:#f6c59a}.rank.meR{background:#fff6fb;border-radius:12px}

async function saveScore(key,score){
  if(!WHO) return;
  if(WHO.t==='g'){try{await db.collection('olum6_groups').doc(WHO.id).set({name:GROUPS[+WHO.id.slice(1)],total:firebase.firestore.FieldValue.increment(score)},{merge:true});}catch(e){toast('لم تُحفظ النقاط، تأكدي من الإنترنت');} return {gain:score};}
  const ref=db.collection('olum6_players').doc(WHO.id);
  try{const d=await ref.get(); const p=d.exists?d.data():{name:ROSTER[+WHO.id.slice(1)],best:{},days:[]}; p.best=p.best||{}; p.days=p.days||[];
    const old=+p.best[key]||0; let gain=0; if(score>old){gain+=score-old;p.best[key]=score;} if(!p.days.includes(today())){p.days.push(today());gain+=5;}
    p.total=totalOf(p); p.at=Date.now(); await ref.set({best:p.best,days:p.days,total:p.total,at:p.at,name:p.name},{merge:true}); ME=p; return {gain,old};}
  catch(e){toast('لم تُحفظ النقاط، تأكدي من الإنترنت'); return {gain:0};}

  hdr('<button id="lb">🏆 الترتيب</button><button id="out">خروج</button>'); $('lb').onclick=board; $('out').onclick=()=>{LS.del('who');WHO=null;welcome();};
  let pts=0,best={};
  if(WHO.t==='s'){try{const d=await db.collection('olum6_players').doc(WHO.id).get(); ME=d.exists?d.data():{}; best=ME.best||{}; pts=ME.total||0;}catch(e){}}
  else{try{const d=await db.collection('olum6_groups').doc(WHO.id).get(); pts=d.exists?(d.data().total||0):0;}catch(e){}}
  const av=WHO.t==='s'?AVS[+WHO.id.slice(1)]:'👭';
  let h=`<div class="card me"><div class="av">${av}</div><div><b style="font-size:18px">${esc(WHO.t==='s'?WHO.name.split(' ')[0]:WHO.name)}</b><div class="msg" style="font-size:13px">${WHO.t==='s'?'نقاطكِ = أفضل نتيجة في كل لعبة + ٥ لكل يوم تتدرّبين فيه':'نقاط المجموعة تُجمع من كل لعبة'}</div></div><div class="pts"><b>${AR(pts)}</b><span>نقطة</span></div></div>
  <div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;background:linear-gradient(135deg,#fff4fa,#f3efff)" id="spd"><div style="font-size:36px">⏱️</div><div><b style="font-size:17px">تحدّي الدقيقة</b><div class="msg" style="font-size:13px">أسئلة مخلوطة من كل الدروس المفتوحة · أجيبي أكبر عدد في ٦٠ ثانية${best.speed?' · أفضل نتيجة: '+AR(best.speed):''}</div></div><div style="margin-inline-start:auto;font-size:22px">◀</div></div>`;
  let cu='';
  LES.forEach(l=>{if(l.unit!==cu){cu=l.unit;h+=`<div class="unit">الوحدة ${AR(cu)}: ${UNITS[cu]||''}</div>`;}
    const op=isOpen(l.id); const gs=GAMES.filter(g=>l[g.k]); const stars=gs.filter(g=>(best[l.id+'_'+g.k]||0)>=80).length;
    h+=`<div class="les${op?'':' lock'}" data-l="${l.id}"><div class="n">${AR(l.id.split("-")[1])}</div><div><div class="t">${esc(l.title)}</div><div class="st">${op?('★'.repeat(stars)+'☆'.repeat(gs.length-stars)):'🔒 لم يُفتح بعد'}</div></div><div class="go">${op?'◀':''}</div></div>`;});
  app.innerHTML=h;
  $('spd').onclick=()=>speed();
  app.querySelectorAll('.les:not(.lock)').forEach(e=>e.onclick=()=>lesson(e.dataset.l,best));
}
function lesson(id,best){const l=LES.find(x=>x.id===id); hdr('<button id="bk">الدروس</button>'); $('bk').onclick=home;
  app.innerHTML=`<div class="card"><div class="msg" style="font-size:14px">الوحدة ${AR(l.unit)} · الدرس ${AR(l.id.split("-")[1])}</div><div class="q" style="margin:2px 0 0">${esc(l.title)}</div></div><div class="games">${GAMES.filter(g=>l[g.k]).map(g=>`<div class="gm" data-g="${g.k}"><div>${g.e}</div><b>${g.n}</b><small>${g.d}</small><br>${WHO.t==='s'&&best[l.id+'_'+g.k]?`<span class="best">أفضل: ${AR(best[l.id+'_'+g.k])}</span>`:''}</div>`).join('')}</div>`;
  app.querySelectorAll('.gm').forEach(e=>e.onclick=()=>({quiz,pairs,sort,diff,order})[e.dataset.g](l));}
function frame(l,title,inner){hdr('<button id="bk">رجوع</button>'); $('bk').onclick=()=>l?lesson(l.id,(ME&&ME.best)||{}):home(); app.innerHTML=`<div class="card"><div class="msg" style="font-size:14px">${l?esc(l.title)+' · ':''}${title}</div><div class="bar"><i id="pb"></i></div>${inner}</div>`;}
async function finish(l,game,score,extra){const key=l?l.id+'_'+game:'speed'; track('game_'+game); const r=await saveScore(key,score);
  const e=score>=90?'🏆':score>=70?'🌟':score>=50?'👏':'💪';
  app.innerHTML=`<div class="card res"><div class="e">${e}</div><div class="sc">${AR(score)}</div><div class="msg">${extra||''}</div>${WHO.t==='s'?(r.gain?`<p style="font-weight:800;color:var(--ok)">+${AR(r.gain)} نقطة إلى رصيدكِ</p>`:`<p class="msg">أفضل نتيجة لكِ هنا ${AR(r.old||score)}. تفوّقي عليها لتكسبي نقاطًا!</p>`):`<p style="font-weight:800;color:var(--ok)">+${AR(score)} نقطة لمجموعتكن</p>`}
  <div style="display:grid;gap:8px;margin-top:10px"><button class="btn" id="again">العبي مرة أخرى</button><button class="btn gh" id="back">${l?'ألعاب الدرس':'الرئيسية'}</button></div></div>`;
  $('again').onclick=()=>l?({quiz,pairs,sort,diff,order})[game](l):speed(); $('back').onclick=()=>l?lesson(l.id,(ME&&ME.best)||{}):home();}
const setBar=(i,n)=>{$('pb').style.width=(100*i/n)+'%';};

/* ---------- games ---------- */
function quiz(l){const Q=shuffle(l.quiz).slice(0,10); let i=0,c=0;
  const show=()=>{if(i>=Q.length) return finish(l,'quiz',Math.round(100*c/Q.length),`أصبتِ في ${AR(c)} من ${AR(Q.length)}`); const q=Q[i]; const o=q.tf?q.o:shuffle(q.o);
    frame(l,'سؤال وجواب',`<div class="q">${esc(q.q)}</div><div class="ops${q.tf||o.every(x=>x.length<14)?' two':''}">${o.map(x=>`<button class="op" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="fb" id="fb"></div><button class="btn w" id="nx" style="margin-top:12px;display:none">التالي ◀</button>`); setBar(i,Q.length);
    app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(app.querySelector('.op.ok,.op.bad')) return; const ok=b.dataset.v===q.a; snd(ok); if(ok)c++; app.querySelectorAll('.op').forEach(x=>{if(x.dataset.v===q.a)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
      $('fb').className='fb '+(ok?'g':'r'); $('fb').textContent=ok?'✓ أحسنتِ!':('✗ الصحيح: '+q.a+(q.why?' — '+q.why.replace(/^خطأ،\s*/,''):'')); $('nx').style.display='block';});
    $('nx').onclick=()=>{i++;show();};};
  show();}
function pairs(l){const P=shuffle(l.pairs); let sel=null,done=0,miss=0; const D=shuffle(P.map((p,i)=>[p[1],i]));
  frame(l,'طابقي المصطلح بتعريفه',`<p class="msg" style="margin-top:0">اضغطي مصطلحًا ثم تعريفه.</p><div class="cols"><div>${P.map((p,i)=>`<button class="tile" data-t="${i}">${esc(p[0])}</button>`).join('')}</div><div>${D.map(d=>`<button class="tile" data-d="${d[1]}">${esc(d[0])}</button>`).join('')}</div></div><div class="fb" id="fb"></div>`); setBar(0,P.length);
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return; app.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b.dataset.t;});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return; if(sel===null){toast('اختاري المصطلح أولًا');return;}
    if(b.dataset.d===sel){snd(1); b.classList.add('done'); app.querySelector(`[data-t="${sel}"]`).classList.remove('sel'); app.querySelector(`[data-t="${sel}"]`).classList.add('done'); sel=null; done++; setBar(done,P.length); if(done===P.length) setTimeout(()=>finish(l,'pairs',Math.max(20,100-miss*10),miss?`أخطأتِ ${AR(miss)} مرة`:'بلا أي خطأ!'),500);}
    else{snd(0); miss++; b.classList.add('err'); setTimeout(()=>b.classList.remove('err'),500);}});}
function cardGame(l,title,items,btns,gk,hint){let i=0,c=0; const I=shuffle(items);
  const show=()=>{if(i>=I.length) return finish(l,gk,Math.round(100*c/I.length),`أصبتِ في ${AR(c)} من ${AR(I.length)}`);
    frame(l,title,`${hint?`<p class="msg" style="margin-top:0">${hint}</p>`:''}<div class="item">${esc(I[i][0])}</div><div class="cats">${btns.map((b,k)=>`<button class="op" data-k="${k}">${esc(b)}</button>`).join('')}</div><div class="fb" id="fb"></div>`); setBar(i,I.length);
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(app.querySelector('.op.ok'))return; const ok=+b.dataset.k===I[i][1]; snd(ok); if(ok)c++; app.querySelectorAll('[data-k]').forEach(x=>{if(+x.dataset.k===I[i][1])x.classList.add('ok');else if(x===b)x.classList.add('bad');}); $('fb').className='fb '+(ok?'g':'r'); $('fb').textContent=ok?'✓ صحيح':'✗ مكانها الصحيح: '+btns[I[i][1]]; setTimeout(()=>{i++;show();},ok?700:1500);});};
  show();}
const sort=l=>cardGame(l,'صنّفي',l.sort.items,l.sort.cats,'sort','أين تضعين هذه؟');
const diff=l=>cardGame(l,'ما الفرق؟',l.diff.items,[l.diff.a,l.diff.b],'diff','هذه الصفة لأيّهما؟');
function order(l){const it=l.order.items; let k=0,miss=0; const S=shuffle(it.map((x,i)=>[x,i]));
  frame(l,'رتّبي',`<p class="msg" style="margin-top:0">${esc(l.order.title)}: اضغطي بالترتيب الصحيح.</p><div class="seq" id="sq"></div><div>${S.map(s=>`<button class="tile" data-o="${s[1]}">${esc(s[0])}</button>`).join('')}</div>`); setBar(0,it.length);
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return; if(+b.dataset.o===k){snd(1); b.classList.add('done'); $('sq').insertAdjacentHTML('beforeend',`<span>${AR(k+1)}. ${esc(it[k])}</span>`); k++; setBar(k,it.length); if(k===it.length) setTimeout(()=>finish(l,'order',Math.max(20,100-miss*15),miss?`أخطأتِ ${AR(miss)} مرة`:'ترتيب كامل بلا خطأ!'),500);}
    else{snd(0); miss++; b.classList.add('err'); setTimeout(()=>b.classList.remove('err'),500);}});}
function speed(){const pool=shuffle(LES.filter(l=>isOpen(l.id)).flatMap(l=>l.quiz.map(q=>Object.assign({lt:l.title},q)))); if(!pool.length){toast('لا توجد دروس مفتوحة بعد');return;}
  let i=0,c=0,left=60,tm=null; const end=()=>{clearInterval(tm); finish(null,'speed',c*5,`أجبتِ إجابة صحيحة عن ${AR(c)} سؤالًا في دقيقة`);};
  const show=()=>{const q=pool[i%pool.length]; const o=q.tf?q.o:shuffle(q.o);
    frame(null,'⏱️ تحدّي الدقيقة',`<div class="clock" id="ck">${AR(left)}</div><div class="msg" style="text-align:center;font-size:13px">${esc(q.lt)} · صحيحة: ${AR(c)}</div><div class="q">${esc(q.q)}</div><div class="ops${q.tf||o.every(x=>x.length<14)?' two':''}">${o.map(x=>`<button class="op" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`); $('pb').style.width=(100*(60-left)/60)+'%';
    $('bk').onclick=()=>{clearInterval(tm);home();};
    app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(app.querySelector('.op.ok,.op.bad'))return; const ok=b.dataset.v===q.a; snd(ok); if(ok)c++; b.classList.add(ok?'ok':'bad'); if(!ok) app.querySelectorAll('.op').forEach(x=>{if(x.dataset.v===q.a)x.classList.add('ok')}); setTimeout(()=>{i++; if(left>0) show();},ok?300:900);});};
  show(); tm=setInterval(()=>{left--; const e=$('ck'); if(e) e.textContent=AR(Math.max(0,left)); if(left<=0) end();},1000);}

/* ---------- leaderboard ---------- */
async function board(){hdr('<button id="bk">رجوع</button>'); $('bk').onclick=home;
  app.innerHTML=`<div class="card"><b style="font-size:19px">🏆 لوحة الشرف</b><div id="pl" class="msg" style="margin-top:8px">جارٍ التحميل…</div></div><div class="card"><b style="font-size:17px">👭 المجموعات</b><div id="gl" class="msg" style="margin-top:8px"></div></div>`;
  try{const q=await db.collection('olum6_players').get(); const L=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(p=>(p.total||0)>0).sort((a,b)=>(b.total||0)-(a.total||0));
    $('pl').innerHTML=L.length?L.map((p,i)=>`<div class="rank r${i+1}${WHO&&WHO.id===p.id?' meR':''}"><div class="p">${i<3?['🥇','🥈','🥉'][i]:AR(i+1)}</div><span>${AVS[+p.id.slice(1)]||''} ${esc((p.name||'').split(' ')[0])}</span><b>${AR(p.total||0)}</b></div>`).join(''):'لم تبدأ أي طالبة بعد، كوني الأولى!';
    const g=await db.collection('olum6_groups').get(); const G=g.docs.map(d=>d.data()).sort((a,b)=>(b.total||0)-(a.total||0));
    $('gl').innerHTML=G.length?G.map((x,i)=>`<div class="rank r${i+1}"><div class="p">${AR(i+1)}</div><span>${esc(x.name)}</span><b>${AR(x.total||0)}</b></div>`).join(''):'لا توجد نقاط للمجموعات بعد.';}
  catch(e){$('pl').textContent='تعذّر التحميل، تأكدي من الإنترنت.';}}

/* ---------- teacher ---------- */
async function admin(){hdr('<span style="font-weight:800">لوحة المعلمة</span>');
  app.innerHTML=`<div class="card"><b>تقدّم الطالبات</b><div style="overflow-x:auto;margin-top:8px" id="tb">جارٍ التحميل…</div><p class="msg" style="font-size:12px">النسبة = متوسط أفضل نتائج الطالبة في ألعاب الدرس. الأحمر يحتاج مراجعة.</p></div>
  <div class="card"><b>الدروس المفتوحة للطالبات</b><div class="chk" id="ck" style="margin-top:8px"></div><button class="btn tl w" id="sv" style="margin-top:10px">احفظي</button></div>
  <div class="card"><b>إدارة</b><p class="msg" style="font-size:13px;margin:4px 0 8px">إذا نسيت طالبة رقمها السري، امسحيه فتختار رقمًا جديدًا عند الدخول (نقاطها تبقى).</p><div class="names" id="rs"></div><button class="btn gh w" id="rg" style="margin-top:10px">تصفير نقاط المجموعات</button></div>`;
  await loadCfg();
  $('ck').innerHTML=LES.map(l=>`<label><input type="checkbox" value="${l.id}"${isOpen(l.id)?' checked':''}>${esc(l.title)}</label>`).join('');
  $('sv').onclick=async()=>{const o=[...$('ck').querySelectorAll('input:checked')].map(x=>x.value); try{await db.collection('olum6_cfg').doc('main').set({open:o},{merge:true}); OPEN=o; toast('تم الحفظ');}catch(e){toast('تعذّر الحفظ');}};
  $('rs').innerHTML=ROSTER.map((n,i)=>`<button data-r="${i}">🔑 ${esc(n.split(' ')[0])}</button>`).join('');
  $('rs').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='اضغطي للتأكيد';return;} try{await db.collection('olum6_players').doc('s'+b.dataset.r).set({pin:''},{merge:true}); b.textContent='✓ مُسح الرقم';}catch(e){toast('تعذّر');}});
  $('rg').onclick=async()=>{const b=$('rg'); if(!b.dataset.sure){b.dataset.sure=1;b.textContent='اضغطي مرة أخرى للتأكيد';return;} try{for(let i=0;i<GROUPS.length;i++) await db.collection('olum6_groups').doc('g'+i).set({name:GROUPS[i],total:0}); b.textContent='✓ تم التصفير';}catch(e){toast('تعذّر');}};
  try{const q=await db.collection('olum6_players').get(); const M={}; q.docs.forEach(d=>M[d.id]=d.data());
    const cell=(p,l)=>{const gs=GAMES.filter(g=>l[g.k]); const v=gs.map(g=>(p.best||{})[l.id+'_'+g.k]||0); const played=v.filter(Boolean).length; if(!played) return '<td>–</td>'; const avg=Math.round(v.reduce((a,b)=>a+b,0)/gs.length); const c=avg>=80?'#d8f5ec':avg>=50?'#fff2cc':'#fde0e7'; return `<td><div class="hm" style="background:${c}">${AR(avg)}٪</div></td>`;};
    $('tb').innerHTML=`<table><tr><th>الطالبة</th><th>النقاط</th><th>أيام</th>${LES.map(l=>`<th title="${esc(l.title)}">${AR(l.unit)}/${AR(l.id.split("-")[1])}</th>`).join('')}</tr>${ROSTER.map((n,i)=>{const p=M['s'+i]||{};return `<tr><td class="nm">${esc(n.split(' ')[0])}</td><td>${AR(p.total||0)}</td><td>${AR((p.days||[]).length)}</td>${LES.map(l=>cell(p,l)).join('')}</tr>`;}).join('')}</table>`;}
  catch(e){$('tb').textContent='تعذّر التحميل.';}}

/* ---------- boot ---------- */
(async()=>{
  if(!db){app.innerHTML='<div class="card msg">تعذّر التحميل، تأكدي من الإنترنت ثم حدّثي الصفحة.</div>';return;}
  await loadCfg(); track('open');
  if(P.get('admin')){ if(await sha(P.get('admin'))===ADMIN_HASH) return admin(); app.innerHTML='<div class="card msg">الرابط غير صحيح.</div>'; return; }
  if(WHO) home(); else welcome();
})();
</script>
